name: Reusable repository tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out configuration repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 shellcheck zstd
      - name: Validate locks, scripts, target configs, and test contracts
        run: make test
