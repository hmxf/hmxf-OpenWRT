name: Manual pinned source validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to validate from source
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - rpi4
          - rpi5
      preset:
        description: Package and driver preset
        required: true
        default: minimal
        type: choice
        options:
          - minimal
          - full

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}-${{ inputs.preset }}
  cancel-in-progress: true

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out configuration repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install source validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang curl flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync shellcheck squashfs-tools swig unzip zlib1g-dev file wget zstd
      - name: Validate repository and pinned source configuration
        run: make validate source-check DEVICE="${{ inputs.target }}" PRESET="${{ inputs.preset }}"
